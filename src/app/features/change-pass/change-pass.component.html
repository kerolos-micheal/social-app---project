<div class="mx-auto max-w-7xl px-3 py-3.5">
  <main class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="mb-5 flex items-center gap-3">
          <span class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-violet-100 text-violet-700">
            <i class="fa-solid fa-key" aria-hidden="true"></i>
          </span>
          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">Keep your account secure by using a strong password.</p>
          </div>
        </div>

        <form [formGroup]="changePasswordForm" (ngSubmit)="submitChangePassword()" novalidate class="space-y-4">
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Current password</span>
            <input formControlName="password" type="password" autocomplete="current-password"
              placeholder="Enter current password"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-violet-600 focus:bg-white">
            @if (changePasswordForm.get('password')?.touched && changePasswordForm.get('password')?.hasError('required')) {
            <span class="mt-1 block text-xs text-red-600">Current password is required.</span>
            }
          </label>

          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">New password</span>
            <input formControlName="newPassword" type="password" autocomplete="new-password"
              placeholder="Enter new password"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-violet-600 focus:bg-white">
            <span class="mt-1 block text-xs text-slate-500">At least 8 characters with uppercase, lowercase, number, and special character.</span>
            @if (changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.hasError('required')) {
            <span class="mt-1 block text-xs text-red-600">New password is required.</span>
            }
            @if (changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.hasError('pattern')) {
            <span class="mt-1 block text-xs text-red-600">Password does not meet the requirements.</span>
            }
          </label>

          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">Confirm new password</span>
            <input formControlName="confirmPassword" type="password" autocomplete="new-password"
              placeholder="Re-enter new password"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-violet-600 focus:bg-white">
            @if (changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.get('confirmPassword')?.hasError('required')) {
            <span class="mt-1 block text-xs text-red-600">Please confirm your new password.</span>
            }
            @if (changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.hasError('passwordsMismatch')) {
            <span class="mt-1 block text-xs text-red-600">Passwords do not match.</span>
            }
          </label>

          @if (errorMessage()) {
          <p role="alert" class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ errorMessage() }}</p>
          }
          @if (successMessage()) {
          <p role="status" class="rounded-lg bg-green-50 px-3 py-2 text-sm text-green-700">{{ successMessage() }}</p>
          }

          <button type="submit" [disabled]="changePasswordForm.invalid || isLoading()"
            class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-br from-violet-600 via-violet-700 to-indigo-800 px-4 py-2.5 text-sm font-bold text-white transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-60">
            {{ isLoading() ? 'Updating...' : 'Update password' }}
          </button>
        </form>
      </section>
    </div>
  </main>
</div>
